<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <title>Gelişmiş Etkileşimli Matematik ve Geometri Tahtası</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overscroll-behavior: none;
    }

    /* Dokunmatik alan kuralları */
    #drawCanvas, #previewCanvas, #instrumentsLayer, #imageLayer, #workspace, .instrument, #compassContainer {
      touch-action: none;
    }

    #sidebar, #sidebar * {
      touch-action: pan-y;
    }

    #bottomPalette, #bottomPalette * {
      touch-action: pan-x pan-y;
    }

    /* Tahta Arka Planları */
    .board-bg {
      background-color: #ffffff;
    }
    
    .board-bg.grid-graph {
      background-image: 
        linear-gradient(to right, rgba(51, 65, 85, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(51, 65, 85, 0.12) 1px, transparent 1px);
      background-size: 25px 25px;
    }

    .board-bg.grid-dots {
      background-image: radial-gradient(rgba(51, 65, 85, 0.25) 1.5px, transparent 0);
      background-size: 24px 24px;
      background-position: -0.5px -0.5px;
    }

    .board-bg.grid-isometric {
      background-image: radial-gradient(rgba(51, 65, 85, 0.25) 1px, transparent 0);
      background-size: 30px 51.96px;
    }

    /* Geometri Aletleri: CPU yormayan hafif yarı saydam stil (blur kaldırıldı) */
    .instrument {
      position: absolute;
      touch-action: none;
      transform-origin: 0 0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      cursor: grab;
      z-index: 30;
    }

    .instrument:active {
      cursor: grabbing;
    }

    .glass-acrylic {
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(100, 116, 139, 0.5);
    }

    .geometry-icon {
      width: 22px; height: 22px; flex: 0 0 22px;
      stroke: currentColor; fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }

    #bottomPalette {
      max-width: calc(100vw - 280px);
      overflow-x: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    #btnSidebarToggle {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 90;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: #0f172a;
      color: #e2e8f0;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 35;
    }
    #sidebarOverlay.open { display: block; }

    @media (max-width: 900px) {
      #sidebar { width: 170px !important; flex: 0 0 170px; }
      #bottomPalette {
        left: calc(50% + 105px);
        max-width: calc(100vw - 235px);
      }
      .draw-tool span { display: none; }
    }

    @media (max-width: 700px) {
      #btnSidebarToggle { display: flex; }
      #sidebar {
        position: fixed !important;
        left: 0; top: 0; bottom: 0;
        width: min(280px, 86vw) !important;
        z-index: 80;
        transform: translateX(-105%);
        transition: transform 0.2s ease;
        pointer-events: none;
      }
      #sidebar.mobile-open {
        transform: translateX(0);
        pointer-events: auto;
      }
      #workspace { width: 100%; flex: 1 1 100%; }
      #bottomPalette {
        left: 50% !important;
        transform: translateX(-50%) !important;
        max-width: calc(100vw - 16px) !important;
        bottom: 8px;
      }
    }

    /* Tutamaçlar */
    .handle {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      cursor: pointer;
      z-index: 60;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      touch-action: none;
    }
    
    .rotate-handle { background-color: #2563eb; }
    .resize-handle { background-color: #059669; }
    .delete-handle { background-color: #dc2626; }

    #compassContainer {
      position: absolute;
      touch-action: none;
      z-index: 35;
    }

    .img-bg-btn {
      position: absolute;
      left: 4px; bottom: 4px;
      z-index: 70;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #64748b;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      cursor: pointer;
    }

    .placed-image-container {
      position: absolute;
      touch-action: none;
      z-index: 25;
      cursor: move;
      border: 2px dashed transparent;
    }
    .placed-image-container.active { border-color: #2563eb; }
  </style>
</head>
<body class="h-screen w-screen flex text-slate-800 antialiased select-none overflow-hidden bg-white">

  <!-- Mobil Menü Butonu -->
  <button type="button" id="btnSidebarToggle" title="Menü">
    <i data-lucide="menu" class="w-5 h-5"></i>
  </button>
  <div id="sidebarOverlay"></div>

  <!-- 1. SOL MENÜ -->
  <aside id="sidebar" class="w-48 bg-slate-900 border-r border-slate-800 text-slate-100 z-40 flex flex-col justify-between py-3 px-3 shrink-0 shadow-xl">
    <div class="flex flex-col gap-3 overflow-y-auto pr-1">
      <!-- Başlık -->
      <div class="flex items-center gap-2.5 px-1 py-1 text-indigo-400 font-bold border-b border-slate-800 pb-2.5">
        <i data-lucide="shapes" class="w-7 h-7 shrink-0 text-indigo-400"></i>
        <div>
          <div class="text-sm text-white font-bold tracking-wide">GEOMATİK</div>
          <div class="text-[10px] text-indigo-300 font-medium">Akıllı Tahta Sürümü</div>
        </div>
      </div>

      <!-- Dosya İşlemleri -->
      <div class="flex flex-col gap-1.5">
        <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase px-1">Dosya & Medya</span>
        
        <label class="flex items-center gap-2.5 p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer transition">
          <i data-lucide="file-up" class="w-4 h-4 shrink-0"></i>
          <span class="text-xs font-medium">PDF Aç</span>
          <input type="file" id="pdfInput" accept="application/pdf" class="hidden">
        </label>

        <label class="flex items-center gap-2.5 p-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white cursor-pointer transition">
          <i data-lucide="image" class="w-4 h-4 shrink-0"></i>
          <span class="text-xs font-medium">Resim Yükle</span>
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <!-- PDF Kontrolleri -->
        <div id="pdfControls" class="flex flex-col gap-1.5 hidden bg-slate-800 p-2 rounded-xl border border-slate-700">
          <div class="flex items-center justify-between text-xs">
            <button id="prevPage" class="p-1 hover:bg-slate-700 rounded text-slate-300" title="Önceki"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <span class="font-mono text-[11px] text-slate-200">
              <input type="number" id="pageNum" value="1" min="1" class="w-8 bg-slate-900 border border-slate-700 text-center rounded text-white text-xs py-0.5">
              <span id="pageCount" class="text-slate-400">/ 0</span>
            </span>
            <button id="nextPage" class="p-1 hover:bg-slate-700 rounded text-slate-300" title="Sonraki"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-slate-700 text-xs">
            <button id="zoomOut" class="p-1 hover:bg-slate-700 rounded text-slate-300"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
            <span id="zoomLevel" class="font-mono text-[10px] text-slate-400">100%</span>
            <button id="zoomIn" class="p-1 hover:bg-slate-700 rounded text-slate-300"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>

      <!-- Geometri Araçları -->
      <div class="flex flex-col gap-1 border-t border-slate-800 pt-2.5">
        <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase px-1">Geometri Araçları</span>

        <button id="btnRuler" class="tool-btn flex items-center gap-2.5 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-amber-400" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M6 8v4M9 8v3M12 8v4M15 8v3M18 8v4"/></svg>
          <span class="text-xs font-medium">Cetvel</span>
        </button>
        <button id="btnProtractor" class="tool-btn flex items-center gap-2.5 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-sky-400" viewBox="0 0 24 24"><path d="M3 19a9 9 0 0 1 18 0H3Z"/><path d="M6 16h.01M9 13h.01M12 12h.01M15 13h.01M18 16h.01"/><path d="M12 19v-7"/></svg>
          <span class="text-xs font-medium">Açıölçer</span>
        </button>
        <button id="btnTriangle45" class="tool-btn flex items-center gap-2.5 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-emerald-400" viewBox="0 0 24 24"><path d="M4 20V4h16L4 20Z"/><path d="M4 16h4v4"/><path d="M8 16h8"/></svg>
          <span class="text-xs font-medium">Gönye</span>
        </button>
        <button id="btnCompass" class="tool-btn flex items-center gap-2.5 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
          <svg class="geometry-icon text-rose-400" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v3M11 9 5 20M13 9l6 11M7 18h4M13 18h4"/><path d="M9 9h6"/></svg>
          <span class="text-xs font-medium">Pergel</span>
        </button>
      </div>
    </div>

    <!-- Alt Butonlar -->
    <div class="flex flex-col gap-1.5 border-t border-slate-800 pt-2.5">
      <div class="flex items-center justify-between gap-1">
        <button id="btnUndo" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-white transition flex-1 flex justify-center" title="Geri Al">
          <i data-lucide="undo" class="w-4 h-4"></i>
        </button>
        <button id="btnRedo" class="p-2 hover:bg-slate-800 rounded-xl text-slate-300 hover:text-white transition flex-1 flex justify-center" title="İleri Al">
          <i data-lucide="redo" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Dışa Aktar -->
      <div class="relative" id="exportMenuWrap">
        <button id="btnExport" type="button" class="w-full flex items-center gap-2.5 p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
          <i data-lucide="download" class="w-4 h-4 shrink-0 text-cyan-400"></i>
          <span class="text-xs font-medium">Dışa Aktar</span>
        </button>
        <div id="exportMenu" class="hidden flex-col rounded-xl p-1 shadow-2xl z-[100] w-40 gap-1 border border-slate-600" style="position:fixed; background:#1e293b; color:#e2e8f0;">
          <button id="exportPNG" type="button" class="p-2 text-left text-xs hover:bg-slate-700 text-slate-200 rounded-lg flex items-center gap-2 w-full bg-transparent border-0 cursor-pointer">
            <i data-lucide="image" class="w-4 h-4 text-emerald-400"></i> PNG Görsel
          </button>
          <button id="exportPDF" type="button" class="p-2 text-left text-xs hover:bg-slate-700 text-slate-200 rounded-lg flex items-center gap-2 w-full bg-transparent border-0 cursor-pointer">
            <i data-lucide="file-text" class="w-4 h-4 text-rose-400"></i> PDF Belgesi
          </button>
        </div>
      </div>

      <button id="btnFullscreen" class="flex items-center gap-2.5 p-2 rounded-xl hover:bg-slate-800 text-slate-300 hover:text-white transition">
        <i data-lucide="maximize" class="w-4 h-4 shrink-0 text-amber-400"></i>
        <span class="text-xs font-medium">Tam Ekran</span>
      </button>

      <button id="btnClear" class="flex items-center gap-2.5 p-2 bg-rose-900/60 hover:bg-rose-800/80 text-rose-200 border border-rose-700/60 rounded-xl transition">
        <i data-lucide="trash-2" class="w-4 h-4 shrink-0"></i>
        <span class="text-xs font-semibold">Temizle</span>
      </button>
    </div>
  </aside>

  <!-- 2. ÇALIŞMA ALANI (WORKSPACE) -->
  <main id="workspace" class="relative flex-1 board-bg bg-white overflow-hidden">
    <!-- Arka plan seçici -->
    <div id="backgroundPicker" class="absolute top-3 right-3 z-[70]">
      <button id="btnBackgroundPicker" type="button" class="flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-md">
        <i data-lucide="palette" class="w-4 h-4 text-indigo-600"></i><span>Arka Plan</span><i data-lucide="chevron-down" class="w-3 h-3"></i>
      </button>
      <div id="backgroundPickerMenu" class="hidden mt-2 w-52 rounded-xl border border-slate-200 bg-white p-2 shadow-xl">
        <button type="button" data-board-bg="none" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-xs text-slate-700 hover:bg-indigo-50">Düz Beyaz</button>
        <button type="button" data-board-bg="graph" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-xs text-slate-700 hover:bg-indigo-50">Kareli</button>
        <button type="button" data-board-bg="dots" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-xs text-slate-700 hover:bg-indigo-50">Noktalı</button>
        <button type="button" data-board-bg="isometric" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-xs text-slate-700 hover:bg-indigo-50">İzometrik</button>
        <button type="button" data-board-bg="dark" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-xs text-slate-700 hover:bg-indigo-50">Koyu Tahta</button>
        <button type="button" data-board-bg="blue" class="board-bg-option flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-xs text-slate-700 hover:bg-indigo-50">Açık Mavi</button>
      </div>
    </div>

    <button id="pdfCloseButton" type="button" class="hidden absolute top-3 left-3 z-[80] items-center gap-2 rounded-xl border border-rose-200 bg-white px-3 py-2 text-xs font-semibold text-rose-700 shadow-md">
      <i data-lucide="x" class="w-4 h-4"></i><span>PDF'yi Kapat</span>
    </button>

    <!-- Şekil Menüsü -->
    <div id="shapeMenu" class="absolute top-[58px] right-3 z-[70] w-52 rounded-xl border border-slate-200 bg-white p-2 shadow-xl">
      <div class="px-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-500">Çizim Modu / Şekil</div>
      <select id="shapeSelect" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg p-2 focus:outline-none w-full cursor-pointer">
        <option value="free">✏️ Serbest Çizim</option>
        <option value="text">🔤 Metin / Yazı</option>
        <option value="line">📏 Doğru Parçası</option>
        <option value="ray">↗️ Işın</option>
        <option value="lineInfinite">↔️ Doğru</option>
        <option value="angle">∠ Açı (3 Nokta)</option>
        <option value="arrow">➔ Ok İşareti</option>
        <option value="circle">⭕ Daire / Çember</option>
        <option value="rect">🔲 Dikdörtgen</option>
        <option value="polygon">⬡ Düzgün Çokgen</option>
      </select>
    </div>

    <!-- Çokgen Menüsü -->
    <div id="polygonMenu" class="absolute top-[122px] right-3 z-[70] w-52">
      <button id="btnPolygonMenu" type="button" class="w-full flex items-center justify-between rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-md">
        <span>⬡ Düzgün Çokgen</span><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
      </button>
      <div id="polygonMenuPanel" class="hidden mt-2 rounded-xl border border-slate-200 bg-white p-2 shadow-xl">
        <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-1 pb-1">Kenar Sayısı</div>
        <div class="flex items-center gap-2">
          <button id="polygonMinus" type="button" class="w-8 h-8 rounded-lg bg-slate-800 text-white font-bold">−</button>
          <input id="polygonSides" type="number" min="3" max="30" value="5" class="flex-1 min-w-0 bg-slate-800 border border-slate-700 text-white text-center rounded-lg p-1.5 text-xs">
          <button id="polygonPlus" type="button" class="w-8 h-8 rounded-lg bg-slate-800 text-white font-bold">+</button>
        </div>
        <button id="btnUsePolygon" type="button" class="w-full mt-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-1.5">Çokgen Çiz</button>
      </div>
    </div>

    <!-- PDF Katmanı -->
    <canvas id="pdfCanvas" class="absolute top-0 left-0 pointer-events-none z-0"></canvas>
    
    <!-- Asıl Çizim Katmanı -->
    <canvas id="drawCanvas" class="absolute top-0 left-0 z-10 cursor-crosshair"></canvas>

    <!-- HIZLI ÖNİZLEME KATMANI (Lag ve donmayı bitiren katman) -->
    <canvas id="previewCanvas" class="absolute top-0 left-0 z-15 pointer-events-none"></canvas>

    <!-- Resim Katmanı -->
    <div id="imageLayer" class="absolute inset-0 pointer-events-none z-20"></div>

    <!-- Metin Giriş Kutusu -->
    <div id="textInputBox" class="absolute hidden z-50 bg-slate-900 border border-slate-700 p-2 rounded-xl shadow-2xl flex flex-col gap-2">
      <div class="flex items-center gap-2 border-b border-slate-700 pb-1">
        <input type="number" id="fontSizeInput" value="24" min="12" max="120" class="w-14 bg-slate-800 border border-slate-600 rounded px-1.5 py-0.5 text-xs text-white">
        <button id="btnBold" class="p-1 rounded bg-slate-800 text-white font-bold text-xs w-6 h-6 flex items-center justify-center">B</button>
        <button id="btnItalic" class="p-1 rounded bg-slate-800 text-white italic text-xs w-6 h-6 flex items-center justify-center">I</button>
        <button id="btnApplyText" class="p-1 bg-indigo-600 text-white text-xs rounded px-2 ml-auto">Ekle</button>
      </div>
      <textarea id="textContent" placeholder="Metninizi yazın..." class="bg-slate-800 text-white text-sm p-2 rounded border border-slate-700 focus:outline-none resize-none" rows="2" cols="25"></textarea>
    </div>

    <!-- 3. GEOMETRİ ARAÇLARI KATMANI -->
    <div id="instrumentsLayer" class="absolute inset-0 z-30 pointer-events-none">
      
      <!-- Cetvel -->
      <div id="ruler" class="instrument glass-acrylic rounded-md hidden pointer-events-auto" style="width: 480px; height: 80px; top: 100px; left: 100px;">
        <canvas id="rulerCanvas" class="w-full h-full"></canvas>
        <div class="handle rotate-handle -top-3.5 -right-3.5" data-action="rotate" title="Döndür"></div>
        <div class="handle resize-handle -bottom-3.5 -right-3.5" data-action="resize" title="Uzunluğu Ayarla"></div>
      </div>

      <!-- Açıölçer -->
      <div id="protractor" class="instrument glass-acrylic rounded-t-full hidden pointer-events-auto" style="width: 380px; height: 190px; top: 180px; left: 240px;">
        <canvas id="protractorCanvas" class="w-full h-full"></canvas>
        <div id="protractorResizeHandleLeft" class="handle resize-handle" style="left:-14px; bottom:-14px;" title="Döndür (180°)"></div>
        <div id="protractorResizeHandle" class="handle resize-handle" style="right:-14px; bottom:-14px;" title="Döndür (0°)"></div>
        <button id="btnToggle360" class="absolute bottom-2 left-3 bg-slate-900 text-white text-[10px] px-2 py-0.5 rounded border border-slate-600">180° / 360°</button>
      </div>

      <!-- Gönye -->
      <div id="triangle45" class="instrument hidden pointer-events-auto" style="width: 290px; height: 290px; top: 100px; left: 100px;">
        <canvas id="triangle45Canvas" class="w-full h-full"></canvas>
        <div class="handle rotate-handle" data-action="rotate" style="left: -14px; bottom: -14px;" title="Döndür"></div>
        <div class="handle resize-handle -bottom-3.5 -right-3.5" data-action="resize" title="Boyutlandır"></div>
      </div>

      <!-- Pergel -->
      <div id="compassContainer" class="hidden pointer-events-auto">
        <button id="btnCompassDrawLock" type="button" class="absolute z-[80] flex items-center gap-1 rounded-lg border border-slate-600 bg-slate-900 px-2 py-1 text-[10px] font-semibold text-slate-100 shadow-md" style="left:50%; top:8px; transform:translateX(-50%);">
          <span id="compassLockIcon">🔒</span> <span id="compassLockLabel">Çizim kilitli</span>
        </button>
        <svg id="compassSVG" width="360" height="500" viewBox="-180 -350 360 500" class="overflow-visible">
          <circle id="compassGuideCircle" cx="0" cy="0" r="100" stroke="#2563eb" stroke-dasharray="6 5" stroke-width="1.75" fill="rgba(37,99,235,0.05)" opacity="0"/>
          <line id="compassRadiusLine" x1="0" y1="0" x2="100" y2="0" stroke="#2563eb" stroke-dasharray="4 3" stroke-width="1.5" opacity="0"/>

            </g>

            <circle id="compassPivotOuter" cx="60" cy="-180" r="11" fill="#1f2937"/>

    </div>
  </main>

  <!-- 4. ALT YÜZEN PALET -->
  <div id="bottomPalette" class="fixed bottom-2 left-[calc(50%+100px)] -translate-x-1/2 bg-slate-900 text-white border border-slate-700 rounded-xl px-2 py-1.5 flex items-center gap-2 z-50 shadow-2xl">
    
    <!-- Sayfa Değiştirici -->
    <div class="flex items-center gap-1 bg-slate-800 px-1.5 py-0.5 rounded-lg border border-slate-700">
      <button id="btnPrevBoardPage" class="p-1 hover:bg-slate-700 rounded text-slate-300" title="Önceki Sayfa"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
      <span id="boardPageIndicator" class="text-xs font-mono px-1">1/1</span>
      <button id="btnNextBoardPage" class="p-1 hover:bg-slate-700 rounded text-slate-300" title="Sonraki Sayfa"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>

    <!-- Renkler -->

      <button data-color="#2563eb" class="color-preset w-6 h-6 rounded-full bg-blue-600 shadow-sm"></button>
      <button data-color="#16a34a" class="color-preset w-6 h-6 rounded-full bg-green-600 shadow-sm"></button>
      <button data-color="#ca8a04" class="color-preset w-6 h-6 rounded-full bg-yellow-600 shadow-sm"></button>
      <button data-color="#9333ea" class="color-preset w-6 h-6 rounded-full bg-purple-600 shadow-sm"></button>
      <button data-color="#ffffff" class="color-preset w-6 h-6 rounded-full bg-white border border-slate-400 shadow-sm" title="Beyaz"></button>

      <div class="relative flex items-center justify-center w-7 h-7 rounded-full overflow-hidden border border-slate-600 cursor-pointer ml-1">
        <input type="color" id="penColor" value="#000000" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer bg-transparent border-0">
      </div>

    <div class="h-6 w-px bg-slate-700"></div>

    <!-- Kalınlık -->
    <div class="flex items-center gap-1.5">
      <i data-lucide="circle-dot" class="w-4 h-4 text-slate-400"></i>
      <button id="penWidthMinus" type="button" class="w-5 h-5 flex items-center justify-center rounded bg-slate-700 text-slate-200 text-xs font-bold">−</button>
      <input type="range" id="penWidth" min="1" max="50" value="4" class="w-20 h-1.5 bg-slate-700 rounded-lg cursor-pointer accent-indigo-500">
      <span id="widthValue" class="text-xs font-mono text-slate-300 w-5 text-center">4</span>
      <button id="penWidthPlus" type="button" class="w-5 h-5 flex items-center justify-center rounded bg-slate-700 text-slate-200 text-xs font-bold">+</button>
    </div>
  </div>

  <script>
    // Tam Ekran
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    // Uygulama Durumu
    const state = {
      pdfDoc: null,
      pageNum: 1,
      zoomScale: 1.0,

      activeBoardPage: 0,
      boardPages: [{ history: [], redoStack: [] }],
      maxHistory: 15, // Belleği korumak için 15 adım yeterlidir

      isDrawing: false,
      activePointerId: null,
      currentTool: 'pen',
      isPanning: false,
      panStart: null,
      panOffsets: { pdfCanvas: [0, 0], drawCanvas: [0, 0], imageLayer: [0, 0], instrumentsLayer: [0, 0] },
      selectedShape: 'free',
      penColor: '#000000',
      penWidth: 4,

      isBold: false,
      isItalic: false,
      pendingTextPos: null,

      shapeStart: null,
      anglePoints: [],
      polygonSides: 5,

      instruments: {
        ruler: { x: 160, y: 100, angle: 0, width: 480, visible: false },
        protractor: { x: 400, y: 300, angle: 0, radius: 190, mode360: false, visible: false },
        triangle45: { x: 340, y: 140, angle: 0, visible: false },
      },

      compass: {
        x: 400, y: 300, radius: 150, angle: 0, visible: false, drawLocked: true
      }
    };

    // DOM ve Canvas Bağlantıları
    const workspace = document.getElementById('workspace');
    const pdfCanvas = document.getElementById('pdfCanvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    const previewCanvas = document.getElementById('previewCanvas');
    const previewCtx = previewCanvas.getContext('2d');
    const imageLayer = document.getElementById('imageLayer');

    // PERFORMANS ÇÖZÜMÜ 1: Hızlı Donanım Destekli Geri Al / İleri Al (toDataURL YOK!)
    function saveCanvasState() {
      const page = state.boardPages[state.activeBoardPage];
      if (page.history.length >= state.maxHistory) {
        page.history.shift();
      }
      // Doğrudan bellek içi hızlı kopya
      const snap = document.createElement('canvas');
      snap.width = drawCanvas.width;
      snap.height = drawCanvas.height;
      snap.getContext('2d').drawImage(drawCanvas, 0, 0);
      page.history.push(snap);
      page.redoStack = [];
    }

    function restoreCanvasState(snapCanvas) {
      if (!snapCanvas) return;
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      drawCtx.drawImage(snapCanvas, 0, 0);
    }

    document.getElementById('btnUndo').addEventListener('click', () => {
      const page = state.boardPages[state.activeBoardPage];
      if (page.history.length > 0) {
        const currentSnap = document.createElement('canvas');
        currentSnap.width = drawCanvas.width;
        currentSnap.height = drawCanvas.height;
        currentSnap.getContext('2d').drawImage(drawCanvas, 0, 0);
        page.redoStack.push(currentSnap);

        const previousState = page.history.pop();
        restoreCanvasState(previousState);
      }
    });

    document.getElementById('btnRedo').addEventListener('click', () => {
      const page = state.boardPages[state.activeBoardPage];
      if (page.redoStack.length > 0) {
        const currentSnap = document.createElement('canvas');
        currentSnap.width = drawCanvas.width;
        currentSnap.height = drawCanvas.height;
        currentSnap.getContext('2d').drawImage(drawCanvas, 0, 0);
        page.history.push(currentSnap);

        const nextState = page.redoStack.pop();
        restoreCanvasState(nextState);
      }
    });

    // Sayfa Yönetimi
    function updatePageIndicator() {
      document.getElementById('boardPageIndicator').textContent = `${state.activeBoardPage + 1}/${state.boardPages.length}`;
    }

    function switchBoardPage(index) {
      if (index < 0 || index >= state.boardPages.length) return;
      state.activeBoardPage = index;
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      const page = state.boardPages[state.activeBoardPage];
      if (page.history.length > 0) {
        restoreCanvasState(page.history[page.history.length - 1]);
      }
      updatePageIndicator();
    }

    document.getElementById('btnAddBoardPage').addEventListener('click', () => {
      state.boardPages.push({ history: [], redoStack: [] });
      switchBoardPage(state.boardPages.length - 1);
    });
    document.getElementById('btnPrevBoardPage').addEventListener('click', () => switchBoardPage(state.activeBoardPage - 1));
    document.getElementById('btnNextBoardPage').addEventListener('click', () => switchBoardPage(state.activeBoardPage + 1));
    document.getElementById('btnDeleteBoardPage').addEventListener('click', () => {
      if (state.boardPages.length <= 1) {
        saveCanvasState();
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        return;
      }
      state.boardPages.splice(state.activeBoardPage, 1);
      switchBoardPage(Math.max(0, state.activeBoardPage - 1));
    });

    // PERFORMANS ÇÖZÜMÜ 2: Sabit DPR (Akıllı tahtada donmayı önler)
    function resizeCanvases() {
      const w = workspace.clientWidth;
      const h = workspace.clientHeight;
      if (!w || !h) return;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = drawCanvas.width;
      tempCanvas.height = drawCanvas.height;
      if (drawCanvas.width > 0 && drawCanvas.height > 0) {
        tempCanvas.getContext('2d').drawImage(drawCanvas, 0, 0);
      }

      // Akıllı tahtalarda 1:1 piksel eşleme yeterlidir, bellek yükünü 4 kat düşürür
      drawCanvas.width = w;
      drawCanvas.height = h;
      drawCanvas.style.width = `${w}px`;
      drawCanvas.style.height = `${h}px`;

      previewCanvas.width = w;
      previewCanvas.height = h;
      previewCanvas.style.width = `${w}px`;
      previewCanvas.style.height = `${h}px`;

      if (tempCanvas.width > 0 && tempCanvas.height > 0) {
        drawCtx.drawImage(tempCanvas, 0, 0);
      }

      if (state.pdfDoc) {
        renderPdfPage(state.pageNum);
      }

      renderRulerGraphics();
      renderProtractorGraphics();
      updateProtractorTransform();
      renderTriangle45Graphics();
      updateCompassTransform();
    }

    window.addEventListener('resize', resizeCanvases);

    // Çizim Motoru (Çift Tuval & Pürüzsüz Eğriler)
    let lastX = 0, lastY = 0;
    let midX = 0, midY = 0;

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function setDrawingStyle(ctx) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = state.currentTool === 'highlighter' ? 0.35 : 1.0;
      ctx.globalCompositeOperation = state.currentTool === 'eraser' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = state.penColor;
      const base = state.currentTool === 'eraser' ? state.penWidth * 6
        : state.currentTool === 'highlighter' ? state.penWidth * 4
        : state.penWidth;
      ctx.lineWidth = base;
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (state.activePointerId !== null) return; // İkincil parmağı yoksay
      state.activePointerId = e.pointerId;
      try { drawCanvas.setPointerCapture(e.pointerId); } catch (_) {}

      const pos = getPos(e);

      if (state.currentTool === 'hand') {
        state.isPanning = true;
        state.panStart = { x: e.clientX, y: e.clientY };
        drawCanvas.style.cursor = 'grabbing';
        return;
      }

      if (state.selectedShape === 'text') {
        const ws = workspace.getBoundingClientRect();
        state.pendingTextPos = pos;
        textInputBox.style.left = `${e.clientX - ws.left}px`;
        textInputBox.style.top = `${e.clientY - ws.top}px`;
        textInputBox.classList.remove('hidden');
        textContent.focus();
        state.activePointerId = null;
        return;
      }

      if (state.selectedShape === 'angle') {
        state.anglePoints.push(pos);
        if (state.anglePoints.length === 3) {
          saveCanvasState();
          drawThreePointAngle(state.anglePoints);
          state.anglePoints = [];
        }
        state.activePointerId = null;
        return;
      }

      saveCanvasState();
      state.isDrawing = true;
      lastX = pos.x; lastY = pos.y;
      midX = pos.x; midY = pos.y;
      state.shapeStart = pos;
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== state.activePointerId) return;

      if (state.isPanning) {
        const dx = e.clientX - state.panStart.x;
        const dy = e.clientY - state.panStart.y;
        ['pdfCanvas', 'drawCanvas', 'previewCanvas', 'imageLayer', 'instrumentsLayer'].forEach(id => {
          const el = document.getElementById(id);
          const [baseX, baseY] = state.panOffsets[id] || [0,0];
          el.style.transform = `translate(${baseX + dx}px, ${baseY + dy}px)`;
        });
        return;
      }

      if (!state.isDrawing) return;
      const pos = getPos(e);

      // PERFORMANS ÇÖZÜMÜ 3: Şekil önizlemesi hafif previewCanvas'ta yapılır (0 Lag)
      if (state.selectedShape !== 'free' && state.currentTool !== 'eraser') {
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        drawShape(previewCtx, state.shapeStart, pos);
      } else {
        // Serbest Çizim
        const mx = (lastX + pos.x) / 2;
        const my = (lastY + pos.y) / 2;
        setDrawingStyle(drawCtx);
        drawCtx.beginPath();
        drawCtx.moveTo(midX, midY);
        drawCtx.quadraticCurveTo(lastX, lastY, mx, my);
        drawCtx.stroke();
        drawCtx.globalAlpha = 1.0;
        midX = mx; midY = my;
        lastX = pos.x; lastY = pos.y;
      }
    });

    function endDrawing(e) {
      if (e.pointerId !== state.activePointerId) return;

      if (state.isDrawing && state.selectedShape !== 'free' && state.currentTool !== 'eraser') {
        const pos = getPos(e);
        previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        setDrawingStyle(drawCtx);
        drawShape(drawCtx, state.shapeStart, pos);
      }

      if (state.isPanning && state.panStart) {
        const dx = e.clientX - state.panStart.x;
        const dy = e.clientY - state.panStart.y;
        ['pdfCanvas', 'drawCanvas', 'previewCanvas', 'imageLayer', 'instrumentsLayer'].forEach(id => {
          if (!state.panOffsets[id]) state.panOffsets[id] = [0, 0];
          state.panOffsets[id][0] += dx;
          state.panOffsets[id][1] += dy;
        });
      }

      state.isPanning = false;
      state.isDrawing = false;
      state.activePointerId = null;
      state.shapeStart = null;
      drawCanvas.style.cursor = state.currentTool === 'hand' ? 'grab' : 'crosshair';
      try { drawCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    drawCanvas.addEventListener('pointerup', endDrawing);
    drawCanvas.addEventListener('pointercancel', endDrawing);

    function drawShape(ctx, start, current) {
      ctx.save();
      setDrawingStyle(ctx);
      ctx.beginPath();

      const dx = current.x - start.x;
      const dy = current.y - start.y;
      const length = Math.hypot(dx, dy) || 1;
      const ux = dx / length, uy = dy / length;

      if (state.selectedShape === 'line') {
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(current.x, current.y);
      } else if (state.selectedShape === 'ray') {
        const ext = Math.max(drawCanvas.width, drawCanvas.height) * 2;
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(start.x + ux * ext, start.y + uy * ext);
      } else if (state.selectedShape === 'lineInfinite') {
        const ext = Math.max(drawCanvas.width, drawCanvas.height) * 2;
        ctx.moveTo(start.x - ux * ext, start.y - uy * ext);
        ctx.lineTo(start.x + ux * ext, start.y + uy * ext);
      } else if (state.selectedShape === 'arrow') {
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(current.x, current.y);
        const headlen = 16;
        const angle = Math.atan2(dy, dx);
        ctx.lineTo(current.x - headlen * Math.cos(angle - Math.PI / 6), current.y - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(current.x, current.y);
        ctx.lineTo(current.x - headlen * Math.cos(angle + Math.PI / 6), current.y - headlen * Math.sin(angle + Math.PI / 6));
      } else if (state.selectedShape === 'circle') {
        const r = Math.hypot(dx, dy);
        ctx.arc(start.x, start.y, r, 0, Math.PI * 2);
      } else if (state.selectedShape === 'rect') {
        ctx.rect(start.x, start.y, dx, dy);
      } else if (state.selectedShape === 'polygon') {
        const r = Math.hypot(dx, dy);
        const rot = Math.atan2(dy, dx) - Math.PI / 2;
        const n = Math.max(3, Math.min(30, state.polygonSides));
        for (let i = 0; i <= n; i++) {
          const a = rot + (i % n) * Math.PI * 2 / n;
          const px = start.x + r * Math.cos(a);
          const py = start.y + r * Math.sin(a);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawThreePointAngle(pts) {
      if (pts.length !== 3) return;
      const [p1, vertex, p3] = pts;
      const rayLen = Math.max(drawCanvas.width, drawCanvas.height) * 2;
      const a1 = Math.atan2(p1.y - vertex.y, p1.x - vertex.x);
      const a2 = Math.atan2(p3.y - vertex.y, p3.x - vertex.x);
      drawCtx.save();
      setDrawingStyle(drawCtx);
      drawCtx.beginPath();
      drawCtx.moveTo(vertex.x, vertex.y);
      drawCtx.lineTo(vertex.x + Math.cos(a1) * rayLen, vertex.y + Math.sin(a1) * rayLen);
      drawCtx.moveTo(vertex.x, vertex.y);
      drawCtx.lineTo(vertex.x + Math.cos(a2) * rayLen, vertex.y + Math.sin(a2) * rayLen);
      drawCtx.stroke();
      pts.forEach(p => {
        drawCtx.beginPath();
        drawCtx.arc(p.x, p.y, 4, 0, Math.PI*2);
        drawCtx.fillStyle = state.penColor;
        drawCtx.fill();
      });
      drawCtx.restore();
    }

    // Alet Seçimleri
    function setTool(tool, btnId) {
      state.currentTool = tool;
      document.querySelectorAll('.draw-tool').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('text-slate-300');
      });
      document.getElementById(btnId).classList.add('bg-indigo-600', 'text-white');
      drawCanvas.style.cursor = tool === 'hand' ? 'grab' : 'crosshair';
    }

    document.getElementById('btnHand').addEventListener('click', () => setTool('hand', 'btnHand'));
    document.getElementById('btnPen').addEventListener('click', () => setTool('pen', 'btnPen'));
    document.getElementById('btnHighlighter').addEventListener('click', () => setTool('highlighter', 'btnHighlighter'));
    document.getElementById('btnEraser').addEventListener('click', () => setTool('eraser', 'btnEraser'));

    // Şekil Seçimi
    document.getElementById('shapeSelect').addEventListener('change', (e) => {
      state.selectedShape = e.target.value;
      state.anglePoints = [];
    });

    document.getElementById('btnPolygonMenu').addEventListener('click', () => {
      document.getElementById('polygonMenuPanel').classList.toggle('hidden');
    });
    document.getElementById('polygonMinus').addEventListener('click', () => {
      state.polygonSides = Math.max(3, state.polygonSides - 1);
      document.getElementById('polygonSides').value = state.polygonSides;
    });
    document.getElementById('polygonPlus').addEventListener('click', () => {
      state.polygonSides = Math.min(30, state.polygonSides + 1);
      document.getElementById('polygonSides').value = state.polygonSides;
    });
    document.getElementById('btnUsePolygon').addEventListener('click', () => {
      state.selectedShape = 'polygon';
      document.getElementById('shapeSelect').value = 'polygon';
      document.getElementById('polygonMenuPanel').classList.add('hidden');
    });

    // Renk ve Kalınlık
    document.querySelectorAll('.color-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        state.penColor = btn.getAttribute('data-color');
        document.getElementById('penColor').value = state.penColor;
        document.querySelectorAll('.color-preset').forEach(b => b.classList.remove('ring-2', 'ring-indigo-500', 'scale-110'));
        btn.classList.add('ring-2', 'ring-indigo-500', 'scale-110');
      });
    });

    document.getElementById('penColor').addEventListener('input', (e) => {
      state.penColor = e.target.value;
    });

    const penWidthInput = document.getElementById('penWidth');
    const widthValueSpan = document.getElementById('widthValue');
    penWidthInput.addEventListener('input', (e) => {
      state.penWidth = parseInt(e.target.value);
      widthValueSpan.textContent = state.penWidth;
    });
    document.getElementById('penWidthMinus').addEventListener('click', () => {
      state.penWidth = Math.max(1, state.penWidth - 1);
      penWidthInput.value = state.penWidth;
      widthValueSpan.textContent = state.penWidth;
    });
    document.getElementById('penWidthPlus').addEventListener('click', () => {
      state.penWidth = Math.min(50, state.penWidth + 1);
      penWidthInput.value = state.penWidth;
      widthValueSpan.textContent = state.penWidth;
    });

    // Temizle & Arka Plan
    document.getElementById('btnClear').addEventListener('click', () => {
      saveCanvasState();
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      imageLayer.innerHTML = '';
    });

    const backgroundPickerMenu = document.getElementById('backgroundPickerMenu');
    document.getElementById('btnBackgroundPicker').addEventListener('click', () => {
      backgroundPickerMenu.classList.toggle('hidden');
    });
    document.querySelectorAll('.board-bg-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const bg = btn.dataset.boardBg;
        workspace.className = 'relative flex-1 board-bg overflow-hidden';
        workspace.style.backgroundColor = '#ffffff';
        if (bg === 'graph') workspace.classList.add('grid-graph');
        else if (bg === 'dots') workspace.classList.add('grid-dots');
        else if (bg === 'isometric') workspace.classList.add('grid-isometric');
        else if (bg === 'dark') workspace.style.backgroundColor = '#1e293b';
        else if (bg === 'blue') workspace.style.backgroundColor = '#eff6ff';
        backgroundPickerMenu.classList.add('hidden');
      });
    });

    // PDF İşlemleri
    const pdfInput = document.getElementById('pdfInput');
    const pdfControls = document.getElementById('pdfControls');
    const pageNumInput = document.getElementById('pageNum');
    const pageCountSpan = document.getElementById('pageCount');

    pdfInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        const fileReader = new FileReader();
        fileReader.onload = function() {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.getDocument(typedarray).promise.then((pdf) => {
            state.pdfDoc = pdf;
            pageCountSpan.textContent = `/ ${pdf.numPages}`;
            pdfControls.classList.remove('hidden');
            document.getElementById('pdfCloseButton').classList.remove('hidden');
            document.getElementById('pdfCloseButton').classList.add('flex');
            state.pageNum = 1;
            pageNumInput.value = 1;
            renderPdfPage(1);
          });
        };
        fileReader.readAsArrayBuffer(file);
      }
    });

    function renderPdfPage(num) {
      if (!state.pdfDoc) return;
      state.pdfDoc.getPage(num).then((page) => {
        const unscaledViewport = page.getViewport({ scale: 1, rotation: 0 });
        const baseScale = Math.min(workspace.clientWidth / unscaledViewport.width, workspace.clientHeight / unscaledViewport.height) * 0.95;
        const viewport = page.getViewport({ scale: baseScale * state.zoomScale, rotation: 0 });

        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        pdfCanvas.style.left = `${(workspace.clientWidth - viewport.width) / 2}px`;
        pdfCanvas.style.top = `${(workspace.clientHeight - viewport.height) / 2}px`;

        page.render({ canvasContext: pdfCtx, viewport: viewport });
        document.getElementById('zoomLevel').textContent = `${Math.round(state.zoomScale * 100)}%`;
      });
    }

    document.getElementById('pdfCloseButton').addEventListener('click', () => {
      state.pdfDoc = null;
      pdfCtx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);
      pdfControls.classList.add('hidden');
      document.getElementById('pdfCloseButton').classList.add('hidden');
      pdfInput.value = '';
    });
    document.getElementById('prevPage').addEventListener('click', () => {
      if (state.pageNum > 1) { state.pageNum--; pageNumInput.value = state.pageNum; renderPdfPage(state.pageNum); }
    });
    document.getElementById('nextPage').addEventListener('click', () => {
      if (state.pdfDoc && state.pageNum < state.pdfDoc.numPages) { state.pageNum++; pageNumInput.value = state.pageNum; renderPdfPage(state.pageNum); }
    });
    document.getElementById('zoomIn').addEventListener('click', () => { state.zoomScale *= 1.2; renderPdfPage(state.pageNum); });
    document.getElementById('zoomOut').addEventListener('click', () => { state.zoomScale = Math.max(0.2, state.zoomScale / 1.2); renderPdfPage(state.pageNum); });

    // Dışa Aktarma (PNG / PDF)
    const exportMenu = document.getElementById('exportMenu');
    document.getElementById('btnExport').addEventListener('click', (e) => {
      e.stopPropagation();
      exportMenu.classList.toggle('hidden');
      exportMenu.classList.toggle('flex');
      const rect = document.getElementById('btnExport').getBoundingClientRect();
      exportMenu.style.left = `${rect.right + 10}px`;
      exportMenu.style.top = `${rect.top}px`;
    });
    document.addEventListener('click', () => exportMenu.classList.add('hidden'));

    document.getElementById('exportPNG').addEventListener('click', () => {
      const outCanvas = document.createElement('canvas');
      outCanvas.width = drawCanvas.width;
      outCanvas.height = drawCanvas.height;
      const ctx = outCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
      if (state.pdfDoc) ctx.drawImage(pdfCanvas, parseFloat(pdfCanvas.style.left)||0, parseFloat(pdfCanvas.style.top)||0);
      ctx.drawImage(drawCanvas, 0, 0);

      const link = document.createElement('a');
      link.download = `cizim-${Date.now()}.png`;
      link.href = outCanvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('exportPDF').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });
      const outCanvas = document.createElement('canvas');
      outCanvas.width = drawCanvas.width;
      outCanvas.height = drawCanvas.height;
      const ctx = outCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
      if (state.pdfDoc) ctx.drawImage(pdfCanvas, parseFloat(pdfCanvas.style.left)||0, parseFloat(pdfCanvas.style.top)||0);
      ctx.drawImage(drawCanvas, 0, 0);

      doc.addImage(outCanvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 297, 210);
      doc.save(`cizim-${Date.now()}.pdf`);
    });

    // Tam Ekran Butonu
    document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);

    // Geometri Araç Çizimleri
    function renderRulerGraphics() {
      const c = document.getElementById('rulerCanvas');
      const r = state.instruments.ruler;
      c.width = r.width;
      c.height = 80;
      const ctx = c.getContext('2d');
      ctx.strokeStyle = '#0f172a';
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';

      const pxPerCm = 32;
      const totalCm = Math.floor(r.width / pxPerCm);

      for (let i = 0; i <= totalCm * 10; i++) {
        const x = i * (pxPerCm / 10);
        let tickLen = (i % 10 === 0) ? 24 : (i % 5 === 0) ? 16 : 8;
        if (i % 10 === 0 && i > 0) ctx.fillText((i / 10).toString(), x, 38);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, tickLen);
        ctx.stroke();
      }
    }

    function renderProtractorGraphics() {
      const c = document.getElementById('protractorCanvas');
      const prot = state.instruments.protractor;
      const r = prot.radius;
      c.width = r * 2;
      c.height = prot.mode360 ? r * 2 : r;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);

      ctx.beginPath();
      if (prot.mode360) ctx.arc(r, r, r - 1, 0, Math.PI * 2);
      else { ctx.moveTo(1, r); ctx.arc(r, r, r - 1, Math.PI, 0); }
      ctx.fillStyle = 'rgba(241, 245, 249, 0.7)';
      ctx.fill();
      ctx.strokeStyle = '#334155';
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const maxDeg = prot.mode360 ? 360 : 180;
      for (let deg = 0; deg <= maxDeg; deg += 10) {
        const rad = deg * Math.PI / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        ctx.beginPath();
        ctx.moveTo(r + (r - 16) * cos, r - (r - 16) * sin);
        ctx.lineTo(r + (r - 2) * cos, r - (r - 2) * sin);
        ctx.stroke();
        if (deg < 360) {
          ctx.font = 'bold 9px sans-serif';
          ctx.fillStyle = '#0f172a';
          ctx.fillText(deg.toString(), r + (r - 26) * cos, r - (r - 26) * sin);
        }
      }
    }

    function updateProtractorTransform() {
      const el = document.getElementById('protractor');
      const p = state.instruments.protractor;
      el.style.transform = `translate3d(${p.x - p.radius}px, ${p.y - p.radius}px, 0px) rotate(${p.angle}deg)`;
      el.style.transformOrigin = `${p.radius}px ${p.radius}px`;
    }

    function renderTriangle45Graphics() {
      const c = document.getElementById('triangle45Canvas');
      c.width = 290; c.height = 290;
      const ctx = c.getContext('2d');
      ctx.beginPath();
      ctx.moveTo(15, 15); ctx.lineTo(15, 275); ctx.lineTo(275, 275);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.fill();
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();
    }

    // Pergel Güncelleme
    function updateCompassTransform() {
      const comp = state.compass;
      const container = document.getElementById('compassContainer');
      container.style.left = `${comp.x}px`;
      container.style.top = `${comp.y}px`;
      container.style.transform = `translate(-180px, -350px) rotate(${comp.angle}deg)`;
      container.style.transformOrigin = '180px 350px';

      const r = comp.radius;
      const hingeX = r / 2;
      document.getElementById('legNeedle').setAttribute('d', `M ${hingeX},-180 L 0,0`);
      document.getElementById('legPencil').setAttribute('d', `M ${hingeX},-180 L ${r},0`);
      document.getElementById('compassPivotOuter').setAttribute('cx', hingeX);
      document.getElementById('topRotationHandle').setAttribute('transform', `translate(${hingeX - 60}, 0)`);
      document.getElementById('pencilAssembly').setAttribute('transform', `translate(${r}, 0)`);
      document.getElementById('radiusHandleCircle').setAttribute('cx', r);
      document.getElementById('compassGuideCircle').setAttribute('r', r);
      document.getElementById('compassRadiusText').textContent = `${(r / 32).toFixed(1)} cm`;
    }

    // Alet Taşıma ve Döndürme
    function setupInstrument(id, key) {
      const el = document.getElementById(id);
      let isDragging = false, isRotating = false, isResizing = false;
      let startX, startY, startAngle, startWidth;

      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        const action = e.target.getAttribute('data-action');
        const inst = state.instruments[key];
        const rect = workspace.getBoundingClientRect();

        if (action === 'rotate') {
          isRotating = true;
          startAngle = inst.angle;
          const cx = rect.left + inst.x + el.offsetWidth / 2;
          const cy = rect.top + inst.y + el.offsetHeight / 2;
          startX = Math.atan2(e.clientY - cy, e.clientX - cx);
        } else if (action === 'resize') {
          isResizing = true;
          startWidth = inst.width || el.offsetWidth;
          startX = e.clientX;
        } else {
          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;
        }
        try { el.setPointerCapture(e.pointerId); } catch(_) {}
      });

      el.addEventListener('pointermove', (e) => {
        const inst = state.instruments[key];
        if (isDragging) {
          inst.x += e.clientX - startX;
          inst.y += e.clientY - startY;
          startX = e.clientX; startY = e.clientY;
          el.style.transform = `translate3d(${inst.x}px, ${inst.y}px, 0px) rotate(${inst.angle}deg)`;
        } else if (isRotating) {
          const rect = workspace.getBoundingClientRect();
          const cx = rect.left + inst.x + el.offsetWidth / 2;
          const cy = rect.top + inst.y + el.offsetHeight / 2;
          const cur = Math.atan2(e.clientY - cy, e.clientX - cx);
          inst.angle = startAngle + (cur - startX) * 180 / Math.PI;
          el.style.transform = `translate3d(${inst.x}px, ${inst.y}px, 0px) rotate(${inst.angle}deg)`;
        } else if (isResizing) {
          inst.width = Math.max(200, Math.min(900, startWidth + (e.clientX - startX)));
          el.style.width = `${inst.width}px`;
          renderRulerGraphics();
        }
      });

      const stop = (e) => {
        isDragging = isRotating = isResizing = false;
        try { el.releasePointerCapture(e.pointerId); } catch(_) {}
      };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
    }

    setupInstrument('ruler', 'ruler');
    setupInstrument('triangle45', 'triangle45');

    // Aletleri Göster / Gizle Butonları
    function bindToolBtn(btnId, elId, key) {
      document.getElementById(btnId).addEventListener('click', () => {
        const inst = state.instruments[key];
        inst.visible = !inst.visible;
        document.getElementById(elId).classList.toggle('hidden', !inst.visible);
        document.getElementById(btnId).classList.toggle('bg-indigo-600', inst.visible);
        if (key === 'protractor') updateProtractorTransform();
        else document.getElementById(elId).style.transform = `translate3d(${inst.x}px, ${inst.y}px, 0px) rotate(${inst.angle}deg)`;
      });
    }
    bindToolBtn('btnRuler', 'ruler', 'ruler');
    bindToolBtn('btnProtractor', 'protractor', 'protractor');
    bindToolBtn('btnTriangle45', 'triangle45', 'triangle45');

    // Pergel Butonu
    document.getElementById('btnCompass').addEventListener('click', () => {
      state.compass.visible = !state.compass.visible;
      document.getElementById('compassContainer').classList.toggle('hidden', !state.compass.visible);
      document.getElementById('btnCompass').classList.toggle('bg-indigo-600', state.compass.visible);
      updateCompassTransform();
    });

    // Sayfa Başlangıcı
    window.onload = () => {
      resizeCanvases();
      updatePageIndicator();
      if (window.lucide) lucide.createIcons();
    };
  </script>
</body>
